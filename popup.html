<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; width: 330px;
        font: 13px/1.5 -apple-system, system-ui, sans-serif;
        background: #14161a; color: #e6e8eb;
      }
      header { padding: 12px 14px 8px; border-bottom: 1px solid #2c313a; }
      h1 { margin: 0; font-size: 13px; font-weight: 600; }
      .sub { color: #95a0ae; font-size: 11px; margin-top: 2px; }
      main { padding: 14px; }
      button {
        width: 100%; padding: 9px; border-radius: 7px; cursor: pointer;
        border: 1px solid #2f6feb; background: #2f6feb; color: #fff;
        font-size: 13px; font-weight: 600;
      }
      button:disabled { opacity: .55; cursor: default; }
      #status { color: #95a0ae; font-size: 11px; margin-top: 10px; min-height: 15px; }
      .verdict {
        margin-top: 12px; padding: 11px; border-radius: 8px;
        font-weight: 700; font-size: 15px; text-align: center; letter-spacing: .3px;
      }
      .normal    { background: #1d3f27; color: #7ee08a; }
      .nsfw      { background: #4a1f2b; color: #ff8fa3; }
      .malicious { background: #4a2f14; color: #ffb454; }
      .bars { margin-top: 11px; }
      .row { display: flex; align-items: center; gap: 7px; margin: 4px 0; font-size: 11px; }
      .row span:first-child { width: 62px; color: #95a0ae; }
      .track { flex: 1; height: 7px; background: #252a33; border-radius: 4px; overflow: hidden; }
      .fill { height: 100%; background: #2f6feb; }
      .pct { width: 38px; text-align: right; color: #95a0ae; }
      .note { margin-top: 10px; color: #6f7885; font-size: 10px; line-height: 1.45; }
      .err { color: #ff8fa3; font-size: 11px; margin-top: 10px; white-space: pre-wrap; }
      .opt { display: flex; align-items: center; gap: 7px; margin-top: 9px;
             font-size: 12px; color: #aeb6c2; cursor: pointer; }
      #rescan { margin-top: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Parental Control</h1>
      <div class="sub">on-device CNN + OCR · nothing is uploaded</div>
    </header>
    <main>
      <div id="out"></div>
      <label class="opt"><input type="checkbox" id="autoScan"> scan pages automatically</label>
      <label class="opt"><input type="checkbox" id="blockFlagged"> block flagged pages</label>
      <button id="rescan">Re-scan this page</button>
    </main>
    <script type="module" src="popup.bundle.js"></script>
  </body>
</html>
